version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # vite-plus and the vite alias in pnpm-workspace.yaml must move together;
      # `vp migrate` updates both.
      - dependency-name: vite-plus
      - dependency-name: vite
      # @astrojs/check supports TypeScript 5 and 6 only.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
