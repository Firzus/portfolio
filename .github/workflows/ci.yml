name: CI

# Checks run locally before each pull request; CI confirms main after merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      - name: Format, lint and types
        run: vp check
      - name: Tests on the rendered pages
        run: vp test
      - name: Translations and production build
        run: vp run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag portfolio .
      - name: Serve both languages from the container
        run: |
          docker run --detach --name portfolio --publish 127.0.0.1:3000:3000 portfolio
          for path in / /en/; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 10 --retry-all-errors --retry-delay 1 "http://127.0.0.1:3000$path"
          done
      - name: Container logs
        if: failure()
        run: docker logs portfolio
