<!-- Atelier mark (A6.1 "cube seams"). The hexagon is the kernel; three thin seams draw
     a cube: three faces = modules assembled around the Core. Seams are true cut-outs
     (mask), so the background always shows through. Recolor via fill on the rect. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="seams">
      <path d="M50 4 L86 24 Q90 26 90 31 L90 69 Q90 74 86 76 L50 96 L14 76 Q10 74 10 69 L10 31 Q10 26 14 24 Z" fill="#fff"/>
      <path d="M50 50 L50 94 M50 50 L88 29 M50 50 L12 29" stroke="#000" stroke-width="6" fill="none" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="#ffffff" mask="url(#seams)"/>
</svg>
